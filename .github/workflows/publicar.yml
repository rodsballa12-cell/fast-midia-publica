name: Publicador Fast
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: publicador
  cancel-in-progress: false
jobs:
  publicar:
    runs-on: ubuntu-latest
    env:
      TOKEN_OK: ${{ secrets.META_PUBLISH_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Publica o que chegou na hora (a menos que exista o arquivo PAUSAR)
        if: env.TOKEN_OK == 'true' && hashFiles('PAUSAR') == ''
        env:
          FAST_NUVEM: '1'
          META_PUBLISH_TOKEN: ${{ secrets.META_PUBLISH_TOKEN }}
          PUBLICO_BASE_URL: https://raw.githubusercontent.com/${{ github.repository }}/main
        run: python publicador/publicador.py executar --janela 0
      - name: Guarda o que foi publicado (estado)
        if: env.TOKEN_OK == 'true'
        run: |
          git config user.name "publicador-fast"
          git config user.email "noreply@users.noreply.github.com"
          git add estado/estado.json
          git diff --cached --quiet || (git commit -m "estado: publicado" && git pull --rebase -q && git push -q)
